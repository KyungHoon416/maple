<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>나의 믿음은 누구를 닮았을까?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="12개의 질문으로 지금의 나와 닮은 성경 인물 카드를 만나 보세요. 회원가입 없이 누구나 무료.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: single-column story flow on phones; two-column dashboard (card left, analysis right) ≥ 960px.
   Deliberately dark-first, single-look design taken from the supplied mockups (sage/ivory/gold on deep green). */
:root {
  --bg: #141B17; --bg-2: #1A231E; --card: #25332C; --card-2: #2C3C34; --line: #3B4D43;
  --sage: #91B39A; --gold: #DCC48A; --gold-deep: #B89A58; --ivory: #F3EBDD; --muted: #C4BBA9; --dim: #9FA79C;
  --danger: #E7A08F;
  --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --sans: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --display: "Cinzel", "Noto Serif KR", serif;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
img { height: auto; max-width: 100%; }
html, body { background: var(--bg); color: var(--ivory); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.65; margin: 0;
  background-image: radial-gradient(1200px 600px at 80% -10%, rgba(145,179,154,.14), transparent 60%), radial-gradient(900px 500px at -10% 30%, rgba(220,196,138,.07), transparent 60%);
  background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--gold); }
button { font: inherit; color: inherit; }
[tabindex="-1"]:focus { outline: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(20,27,23,.88); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(59,77,67,.6); }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ivory); margin-right: auto; }
.brand svg { flex: none; }
.brand b { font-family: var(--display); letter-spacing: .18em; font-weight: 600; font-size: 15px; display: block; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 11.5px; display: block; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; padding: 10px 12px; border-radius: 10px; font-size: 14.5px; min-height: 44px; display: inline-flex; align-items: center; }
.nav a[aria-current="page"] { color: var(--ivory); box-shadow: inset 0 -2px 0 var(--gold); border-radius: 0; }
.nav a:hover { color: var(--ivory); }
@media (max-width: 720px) { .nav { width: 100%; overflow-x: auto; flex-wrap: nowrap; margin-bottom: 4px; } .nav a { white-space: nowrap; font-size: 14px; padding: 8px 10px; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-decoration: none; color: var(--ivory); font-weight: 500; transition: transform .15s, background .15s; }
.btn:hover { background: var(--card-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #EBD9A6, #C9AC6A); color: #1E241F; border-color: #E5D29E; font-weight: 700; box-shadow: 0 8px 30px rgba(220,196,138,.25); }
.btn.gold:hover { background: linear-gradient(180deg, #F1E1B4, #D2B676); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 14.5px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

h1, h2, h3 { font-family: var(--serif); font-weight: 700; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.3; margin: 0; }
.eyebrow { font-family: var(--display); letter-spacing: .3em; font-size: 12.5px; color: var(--gold); text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.panel { background: linear-gradient(180deg, rgba(37,51,44,.92), rgba(30,41,35,.92)); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); background: rgba(20,27,23,.4); }
.chip.gold { color: var(--gold); border-color: rgba(220,196,138,.45); }
.notice { border: 1px dashed rgba(220,196,138,.4); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; color: var(--muted); background: rgba(220,196,138,.05); }

/* intro */
.hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 32px; align-items: center; padding-block: 48px 28px; }
.hero h1 { font-size: clamp(34px, 6vw, 62px); margin: 14px 0 16px; }
.hero .rule { width: 64px; height: 2px; background: var(--gold); margin: 18px 0; }
.hero p.lead { font-size: 18px; color: var(--ivory); max-width: 34ch; }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 26px 0; }
.pill { display: flex; gap: 10px; align-items: flex-start; }
.pill b { display: block; font-family: var(--serif); font-size: 15.5px; }
.pill span { font-size: 13px; color: var(--muted); }
.policy { display: grid; gap: 6px; margin-top: 18px; font-size: 14px; color: var(--muted); }
.policy li { list-style: none; display: flex; gap: 8px; }
.policy li::before { content: "✓"; color: var(--sage); }
.policy ul { margin: 0; padding: 0; display: grid; gap: 4px; }
.fan { position: relative; height: 420px; margin: 0; overflow: hidden; }
.fan .tc-mini { height: auto; aspect-ratio: 4 / 5; border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.fan .tc-mini { position: absolute; width: 46%; max-width: 220px; transition: transform .3s; }
.fan .tc-mini:nth-child(1) { left: 0; top: 70px; transform: rotate(-9deg); }
.fan .tc-mini:nth-child(2) { left: 18%; top: 30px; transform: rotate(-3deg); }
.fan .tc-mini:nth-child(3) { left: 36%; top: 20px; transform: rotate(3deg); }
.fan .tc-mini:nth-child(4) { left: 54%; top: 50px; transform: rotate(9deg); }
.fan figcaption { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 12.5px; color: var(--dim); }
.steps { display: grid; grid-template-columns: 1.2fr repeat(4, 1fr); gap: 14px; align-items: stretch; margin-block: 24px; }
.step { background: rgba(20,27,23,.5); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.step b { font-family: var(--serif); display: block; margin-bottom: 4px; }
.step .n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ivory); color: var(--bg); font-size: 13px; font-weight: 700; margin-right: 6px; }
.step p { margin: 0; font-size: 13.5px; color: var(--muted); }
@media (max-width: 960px) { .hero { grid-template-columns: 1fr; padding-top: 28px; } .fan { height: 330px; max-width: 520px; margin: 0 auto; width: 100%; } .steps { grid-template-columns: 1fr 1fr; } .steps .step:first-child { grid-column: 1 / -1; } }
@media (max-width: 520px) { .pills { grid-template-columns: 1fr; } .fan { height: 270px; } .steps { grid-template-columns: 1fr; } }

/* quiz */
.quiz { max-width: 720px; margin: 0 auto; padding-block: 28px 48px; }
.progress { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.bar { height: 10px; background: var(--card); border-radius: 99px; overflow: hidden; margin: 8px 0 20px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #F0DDAA); border-radius: 99px; transition: width .3s; }
.qtag { display: flex; align-items: center; gap: 12px; justify-content: center; color: var(--gold); font-family: var(--serif); }
.qtag::before, .qtag::after { content: ""; height: 1px; flex: 1; background: var(--line); }
.qtag span { border: 1px solid var(--gold-deep); padding: 2px 16px; border-radius: 99px; }
.quiz h2 { font-size: clamp(24px, 4.6vw, 34px); text-align: center; margin: 18px 0 6px; }
.quiz .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.opts { display: grid; gap: 14px; border: 0; padding: 0; margin: 0; }
.opt { position: relative; display: grid; grid-template-columns: 112px 1fr 28px; gap: 16px; align-items: center; padding: 12px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; min-height: 120px; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--sage); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .art { width: 112px; height: 96px; border-radius: 14px; overflow: hidden; background: var(--bg-2); }
.opt .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.opt .art img.art-photo { object-position: 50% 28%; }
.opt .art img.art-option { object-position: 50% 50%; }
.opt .k { display: inline-grid; place-items: center; width: 34px; height: 26px; border-radius: 7px; background: var(--ivory); color: var(--bg); font-weight: 700; font-family: var(--serif); margin-bottom: 6px; }
.opt .t { font-size: 18px; font-family: var(--serif); line-height: 1.45; }
.opt .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); }
.opt:has(input:checked) { border-color: var(--gold); background: linear-gradient(90deg, rgba(220,196,138,.1), var(--card)); box-shadow: 0 0 0 1px rgba(220,196,138,.25), 0 10px 30px rgba(0,0,0,.25); }
.opt:has(input:checked) .dot { border-color: var(--gold); background: radial-gradient(circle, var(--gold) 45%, transparent 50%); }
.opt:has(input:focus-visible) { outline: 3px solid var(--gold); outline-offset: 3px; }
.hint { display: flex; gap: 12px; align-items: center; margin: 18px 0; padding: 14px 18px; border-radius: 99px; border: 1px solid var(--line); background: rgba(37,51,44,.6); font-size: 14px; color: var(--muted); }
.hint b { color: var(--gold); font-family: var(--serif); }
.qnav { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
@media (max-width: 520px) { .opt { grid-template-columns: 78px 1fr 24px; min-height: 100px; gap: 12px; } .opt .art { width: 78px; height: 78px; } .opt .t { font-size: 16.5px; } .hint { border-radius: 16px; } }

/* reveal */
.reveal { min-height: 72vh; display: grid; place-items: center; text-align: center; padding-block: 32px; }
.flip { display: block; width: min(340px, 82vw); aspect-ratio: 4 / 5; perspective: 1400px; margin: 22px auto; cursor: pointer; border: 0; background: none; padding: 0; }
.flip .inner { display: block; position: relative; width: 100%; height: 100%; -webkit-transform-style: preserve-3d; transition: transform .9s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.flip.open .inner { transform: rotateY(180deg); }
.flip .face { display: block; position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
.flip .face img { width: 100%; height: 100%; display: block; }
.flip .back { transform: rotateY(0deg); }
.flip .front { transform: rotateY(180deg); }
.flip:not(.open) .back { animation: breathe 2.4s ease-in-out infinite; }
/* waiting card trembles now and then; on tap it shakes hard, then flips */
.flip:not(.open) { animation: card-tremble 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
.flip.shake-hard { animation: card-shake .65s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes card-tremble { 0%, 62%, 100% { transform: rotate(0) } 66% { transform: rotate(-2.2deg) } 70% { transform: rotate(2.2deg) } 74% { transform: rotate(-1.6deg) } 78% { transform: rotate(1.2deg) } 82% { transform: rotate(0) } }
@keyframes card-shake {
  0% { transform: translate(0,0) rotate(0) scale(1) } 10% { transform: translate(-6px,2px) rotate(-4deg) scale(1.02) } 20% { transform: translate(7px,-2px) rotate(4deg) scale(1.03) }
  30% { transform: translate(-8px,3px) rotate(-5deg) scale(1.04) } 40% { transform: translate(8px,-3px) rotate(5deg) scale(1.05) } 50% { transform: translate(-7px,2px) rotate(-4deg) scale(1.06) }
  60% { transform: translate(6px,-2px) rotate(3deg) scale(1.06) } 70% { transform: translate(-4px,1px) rotate(-2deg) scale(1.05) } 85% { transform: translate(2px,0) rotate(1deg) scale(1.03) } 100% { transform: translate(0,0) rotate(0) scale(1) }
}
.flip.shake-hard .back { box-shadow: 0 0 60px rgba(220,196,138,.55), 0 30px 60px rgba(0,0,0,.45); }
@keyframes breathe { 50% { box-shadow: 0 30px 70px rgba(220,196,138,.28); } }
@media (prefers-reduced-motion: reduce) { .flip, .flip.shake-hard { animation: none !important; } .flip .inner { transition: none; } .flip:not(.open) .back { animation: none; } .bar i { transition: none; } }

/* result */
.result { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 24px; padding-block: 28px; align-items: start; }
.result > * { min-width: 0; }
.cardcol { position: sticky; top: 84px; display: grid; gap: 14px; }
.cardcol img.tc { width: 100%; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.45); display: block; aspect-ratio: 4 / 5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.radar svg { width: 100%; height: auto; max-width: 420px; display: block; margin: 0 auto; }
.legend { display: grid; gap: 8px; margin-top: 8px; font-size: 13.5px; }
.legend div { display: grid; grid-template-columns: 56px 1fr; gap: 8px; }
.legend b { color: var(--sage); font-family: var(--serif); }
.top3 { display: grid; gap: 10px; counter-reset: rank; }
.top3 li { list-style: none; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(20,27,23,.45); border: 1px solid var(--line); }
.top3 img { width: 56px; height: 70px; object-fit: cover; border-radius: 10px; }
.top3 .sc { font-variant-numeric: tabular-nums; color: var(--gold); font-family: var(--serif); font-size: 18px; text-align: right; }
.top3 ol { padding: 0; margin: 0; }
.evid { margin: 0; padding: 0; display: grid; gap: 8px; }
.evid li { list-style: none; font-size: 14.5px; padding-left: 14px; border-left: 2px solid var(--sage); }
.acts { counter-reset: a; display: grid; gap: 10px; padding: 0; margin: 0; }
.acts li { list-style: none; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.acts li::before { counter-increment: a; content: counter(a); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold-deep); color: var(--gold); font-family: var(--serif); }
.prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
.sectitle { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.sectitle h2 { font-size: 20px; }
@media (max-width: 960px) { .result { grid-template-columns: 1fr; } .cardcol { position: static; max-width: 440px; margin: 0 auto; width: 100%; } .grid2 { grid-template-columns: 1fr; } }

/* card news */
.cn { display: grid; grid-template-columns: 1fr 300px; gap: 24px; padding-block: 24px; }
.cn > * { min-width: 0; }
.viewer { position: relative; display: grid; place-items: center; }
.viewer .slide { width: min(100%, 460px); aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; background: var(--card); box-shadow: 0 20px 60px rgba(0,0,0,.4); touch-action: pan-y; }
.viewer.story .slide { aspect-ratio: 9 / 16; width: min(100%, 340px); }
.viewer .slide img { width: 100%; height: 100%; display: block; }
.viewer .loading { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 14px; }
.dots { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
.dots button { width: 44px; height: 44px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.dots button i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dots button[aria-current="true"] i { background: var(--gold); width: 22px; border-radius: 9px; }
.thumbs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.thumbs label { display: grid; gap: 4px; font-size: 11.5px; color: var(--muted); text-align: center; cursor: pointer; }
.thumbs input { width: 20px; height: 20px; margin: 0 auto; accent-color: var(--gold); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 0 14px; min-height: 40px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ivory); color: var(--bg); font-weight: 700; }
.side { display: grid; gap: 14px; align-content: start; }
.side .btn { width: 100%; }
.cn-text { margin-top: 16px; }
.cn-text details { font-size: 14px; color: var(--muted); }
@media (max-width: 900px) { .cn { grid-template-columns: 1fr; } }

/* dictionary */
.dict-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 18px 0; }
.dict-tools input { flex: 1 1 220px; min-height: 46px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--ivory); padding: 0 18px; font: inherit; }
.dict { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 0; margin: 0; }
.dict li { list-style: none; }
.dict a { display: grid; gap: 6px; text-decoration: none; color: var(--ivory); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; height: 100%; }
.dict a:hover { border-color: var(--sage); }
.dict img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; background: var(--bg-2); }
.dict b { font-family: var(--serif); font-size: 15.5px; }
.dict span { font-size: 12px; color: var(--muted); }
.pager { display: flex; gap: 8px; justify-content: center; margin: 22px 0; flex-wrap: wrap; }
.detail { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding-block: 28px; }
.detail > * { min-width: 0; }
.detail img.portrait { width: 100%; border-radius: 18px; aspect-ratio: 4 / 5; }
.evlist { display: grid; gap: 12px; padding: 0; margin: 0; }
.evlist li { list-style: none; }
@media (max-width: 800px) { .detail { grid-template-columns: 1fr; } .detail img.portrait { max-width: 320px; } }

.prose { max-width: 72ch; padding-block: 28px; }
.prose h2 { font-size: 22px; margin: 28px 0 10px; }
.prose p, .prose li { color: var(--muted); }
.prose table { border-collapse: collapse; width: 100%; font-size: 14px; }
.prose th, .prose td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
.tablewrap { overflow-x: auto; }
footer.foot { border-top: 1px solid var(--line); margin-top: 40px; padding-block: 24px; color: var(--dim); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ivory); color: var(--bg); padding: 12px 20px; border-radius: 12px; font-weight: 600; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100vw - 32px); }
.dialog { position: fixed; inset: 0; background: rgba(8,12,10,.78); display: grid; place-items: center; z-index: 40; padding: 16px; }
.dialog .panel { max-width: 420px; }

.share-panel { width: min(440px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--card); box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.share-panel .sp-card { display: block; width: 160px; aspect-ratio: 4 / 5; border-radius: 12px; margin: 0 auto 14px; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
.share-panel textarea { width: 100%; margin-top: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); color: var(--ivory); padding: 10px 12px; font: inherit; font-size: 14px; line-height: 1.55; resize: none; overflow-wrap: anywhere; word-break: break-all; }

/* 7-day plan */
.plan { padding-block: 28px; display: grid; gap: 18px; max-width: 880px; }
.plan-head { display: grid; grid-template-columns: 160px 1fr; gap: 22px; align-items: center; }
.plan-head > * { min-width: 0; }
.plan-portrait { width: 160px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 16px; border: 2px solid var(--gold-deep); }
.plan-days { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.plan-day h2 { font-size: 19px; margin: 8px 0 6px; }
.plan-day.is-today { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(220,196,138,.35); }
.plan-day.is-done { opacity: .78; }
.plan-day.is-done h2 { text-decoration: line-through; text-decoration-color: rgba(220,196,138,.6); }
.plan-check, .plan-save { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; color: var(--gold); font-family: var(--serif); font-weight: 700; }

.plan-save { color: var(--ivory); font-family: var(--sans); font-weight: 500; }
.plan-ref { margin: 0 0 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.plan-day dl { margin: 0; display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; font-size: 14.5px; }
.plan-day dt { color: var(--sage); font-weight: 600; }
.plan-day dd { margin: 0; }
.plan-mini { padding-left: 0; list-style: none; display: grid; gap: 6px; margin: 0 0 14px; font-size: 14.5px; }

/* small-group guide */
.guide { padding-block: 28px; display: grid; gap: 16px; max-width: 880px; }
.guide-steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.guide-steps h2 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
.step-n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ivory); color: var(--bg); font-size: 15px; }
.guide-items { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.guide-qs { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.guide-qs .chip { margin-right: 4px; }
@media print {
  :root { --bg: #fff; --ivory: #111; --muted: #444; --card: #fff; --line: #bbb; --gold: #7a5d1d; --sage: #2f5a3b; }
  body { background: #fff !important; color: #111; }
  .top, .foot, .no-print, .toast { display: none !important; }
  .panel { background: #fff !important; border-color: #bbb; break-inside: avoid; }
}

  // ── Radar (canvas)

  function quiz() {
    if (complete() && S.idx >= 12) S.idx = 11;

    const answered = S.answers.filter(Boolean).length;

            <label class="opt" for="opt-${o.id}">

              <span class="art" aria-hidden="true"><img alt="" data-art="${q.id}-${o.key}"></span>
              <span><span class="k">${o.key}</span><br><span class="t">${esc(o.text)}</span></span>
              <span class="dot" aria-hidden="true"></span>
            </label>`).join('')}
        </fieldset>
        <div class="hint"><span aria-hidden="true">${icon('star')}</span><span><b>정답은 없어요!</b> 고르면 바로 다음 문항으로 넘어가요. 이전 버튼으로 언제든 고칠 수 있어요.</span></div>
        <p class="sr-only" id="needmsg" aria-live="polite"></p>
        <div class="qnav">
          <button class="btn" id="prev" ${i === 0 ? 'disabled' : ''}>‹ 이전</button>
          <button class="btn gold" id="next" ${S.answers[i] ? '' : 'disabled'} aria-describedby="needmsg">${i === 11 ? '결과 카드 만들기' : '다음 질문'} ›</button>
        </div>
        <p class="small muted" style="text-align:center;margin-top:18px">검사를 중간에 나가도 이 브라우저 탭에서는 이어서 할 수 있어요. 탭을 닫으면 응답이 지워져요.</p>
      </div></section>`;
    $app.querySelectorAll('img[data-art]').forEach(img => {
      const k = img.dataset.art, pid = OPTION_ART[k];
      if ((window.MFS_OPTION_IMAGES || []).includes(k)) { img.src = 'assets/options/' + k + '.webp'; img.classList.add('art-photo', 'art-option'); return; }
      if (pid && RENDER.hasPortrait(pid)) { img.src = RENDER.portraitSrc(pid); img.classList.add('art-photo'); return; }
      if (!optArt.has(k)) optArt.set(k, RENDER.sceneURL('opt-' + k, 224, 192)); img.src = optArt.get(k);
    });
    let submitting = false, advanceTimer = null;
    const advance = () => {
      if (!S.answers[i]) { document.getElementById('needmsg').textContent = '선택지를 하나 골라 주세요.'; return; }
      if (i < 11) { S.idx = i + 1; save(); render(); return; }
      if (submitting) return; submitting = true; document.getElementById('next').disabled = true;
      const missing = S.answers.findIndex(a => !a);
      if (missing >= 0) { submitting = false; S.idx = missing; save(); toast(`${missing + 1}번 문항에 아직 답하지 않았어요.`); render(); return; }
      S.revealed = false; save(); go('reveal');
    };
    const pick = (val) => {
      S.answers[i] = val; RESULT = null; S.revealed = false; save();
      document.getElementById('next').disabled = false;
      const bar = $app.querySelector('.bar'); const n = S.answers.filter(Boolean).length;
      bar.setAttribute('aria-valuenow', n); bar.setAttribute('aria-label', `응답한 문항 ${n}개 / 12개`); bar.querySelector('i').style.width = Math.max(4, n / 12 * 100) + '%';
    };
    // Tap/click on an option selects it and moves straight to the next question (user request).
    // Pointer vs keyboard is tracked explicitly: some browsers (e.g. Safari) report label clicks with
    // event.detail === 0, so detail cannot be used. Arrow keys only select; Enter selects and moves on.
    let viaPointer = false;
    const schedule = () => { clearTimeout(advanceTimer); advanceTimer = setTimeout(advance, reduceMotion ? 0 : 220); };
    $app.querySelectorAll('label.opt').forEach(label => {
      const inp = label.querySelector('input');
      ['pointerdown', 'mousedown', 'touchstart'].forEach(t => label.addEventListener(t, () => { viaPointer = true; }, { passive: true }));
      label.addEventListener('click', () => { if (!viaPointer) return; inp.checked = true; pick(inp.value); schedule(); });
      inp.addEventListener('change', () => { pick(inp.value); if (viaPointer) schedule(); });
      inp.addEventListener('keydown', e => {
        viaPointer = false;
        if (e.key === 'Enter') { e.preventDefault(); inp.checked = true; pick(inp.value); clearTimeout(advanceTimer); advance(); }
      });
    });
    document.getElementById('prev').onclick = () => { clearTimeout(advanceTimer); S.idx = i - 1; save(); render(); };
    document.getElementById('next').onclick = () => { clearTimeout(advanceTimer); advance(); };
  }

  function radarSVG(chart) {
    const cx = 210, cy = 200, R = 140, n = chart.length, ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
    const pt = (i, k) => [cx + Math.cos(ang(i)) * R * k, cy + Math.sin(ang(i)) * R * k].map(v => v.toFixed(1)).join(',');
    const ring = k => chart.map((_, i) => pt(i, k)).join(' ');
    const poly = chart.map((c, i) => pt(i, 0.12 + 0.88 * c.aShare)).join(' ');
    return `<svg viewBox="0 0 420 410" role="img" aria-labelledby="rt rd"><title id="rt">6개 영역 응답 방향 차트</title>
      <desc id="rd">${esc(chart.map(c => `${c.label}: ${c.aShare === 1 ? 'A 방향 2개' : c.aShare === 0 ? 'B 방향 2개' : 'A와 B 하나씩'}`).join(', '))}</desc>
      <polygon points="${ring(1)}" fill="none" stroke="rgba(243,235,221,.35)" stroke-width="1.5"/>
      <polygon points="${ring(0.5)}" fill="none" stroke="rgba(243,235,221,.18)" stroke-width="1.5"/>
      ${chart.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, 1).split(',')[0]}" y2="${pt(i, 1).split(',')[1]}" stroke="rgba(243,235,221,.18)"/>`).join('')}
      <polygon points="${poly}" fill="rgba(145,179,154,.42)" stroke="#91B39A" stroke-width="2.5"/>
      ${chart.map((c, i) => { const [x, y] = pt(i, 0.12 + 0.88 * c.aShare).split(','); return `<circle cx="${x}" cy="${y}" r="4.5" fill="#F3EBDD"/>`; }).join('')}
      ${chart.map((c, i) => { const [x, y] = pt(i, 1.2).split(','); return `<text x="${x}" y="${+y + 6}" text-anchor="middle" fill="#F3EBDD" font-family="Noto Serif KR, serif" font-weight="700" font-size="17">${esc(c.label)}</text>`; }).join('')}
      <text x="${cx + 6}" y="${cy - R * 0.5 + 14}" fill="#9FA79C" font-size="11">A·B 반반</text>
    </svg>`;
  }

  // ── 7-day plan. Progress is kept in memory; it is written to this device (localStorage) only when the
  // person turns that on, and then holds just the plan slug, the start date and the checked days.
  const PKEY = 'mfs-plan-progress';
  const memPlan = {};
  function planStore() { try { return JSON.parse(localStorage.getItem(PKEY) || '{}'); } catch (e) { return {}; } }
  function planWrite(all) { try { localStorage.setItem(PKEY, JSON.stringify(all)); return true; } catch (e) { return false; } }
  function planState(slug) {
    const saved = planStore()[slug];
    if (saved) return { saved: true, checked: saved.checked || [], startedAt: saved.startedAt };
    return { saved: false, checked: memPlan[slug] || [], startedAt: null };
  }
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function planDayIndex(startedAt) {
    if (!startedAt) return 0;
    const ms = new Date(todayStr()) - new Date(startedAt);
    return Math.min(7, Math.max(1, Math.floor(ms / 86400000) + 1));
  }

    if (!arg) { $app.innerHTML = `<section class="wrap prose"><h1>묵상 플랜을 찾을 수 없어요</h1><a class="btn gold" href="#test">12문항 테스트 시작하기</a></section>`; return; }
    const pl = PLAN.build(arg.characterId, arg.eventId), ch = D.CHAR_BY_ID[pl.characterId];
    const st = planState(pl.slug), today = planDayIndex(st.startedAt);
    const done = st.checked.length;
    $app.innerHTML = `<section class="wrap plan">
      <div class="plan-head">
        <img class="plan-portrait" alt="${esc(ch.displayName)} ${RENDER.hasPortrait(ch.id) ? '수채화 일러스트' : '임시 일러스트'}" data-portrait="${ch.id}">

          <h1 style="font-size:clamp(26px,4vw,38px);margin:6px 0">${esc(pl.title)}</h1>
          <p style="margin:0 0 10px">${esc(pl.intro)}</p>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${done}" aria-label="7일 중 ${done}일 완료"><i style="width:${Math.max(4, done / 7 * 100)}%"></i></div>
          <p class="small muted" style="margin:0">${done}/7일 완료${today ? ` · 오늘은 ${today}일차예요` : ''}</p>
        </div>
      </div>
      <p class="notice small">성경 본문은 직접 펼쳐 읽어 주세요. 이 플랜은 장절과 서비스의 자체 요약·질문만 담고 있어요. 나의 응답이나 점수는 담기지 않아요.</p>
      <ol class="plan-days">${pl.days.map(d => `<li class="panel plan-day ${st.checked.includes(d.day) ? 'is-done' : ''} ${today === d.day ? 'is-today' : ''}">
        <label class="plan-check" for="pd-${d.day}"><input type="checkbox" id="pd-${d.day}" data-day="${d.day}" ${st.checked.includes(d.day) ? 'checked' : ''}><span>${d.day}일차${today === d.day ? ' · 오늘' : ''}</span></label>
        <h2>${esc(d.title)}</h2>
        <p class="plan-ref"><span class="chip gold">${esc(d.ref)}</span> <span class="small muted">${esc(d.note)}</span></p>
        <dl><dt>묵상 질문</dt><dd>${esc(d.question)}</dd><dt>오늘의 실천</dt><dd>${esc(d.action)}</dd><dt>짧은 기도</dt><dd class="prayer">${esc(d.prayer)}</dd></dl>
      </li>`).join('')}</ol>
      <div class="panel"><div class="sectitle"><h2>마무리 기도</h2></div><p class="prayer" style="margin:0">${esc(pl.closingPrayer)}</p></div>
      <div class="panel"><div class="sectitle"><h2>진행 상황 저장</h2></div>
        <label class="plan-save" for="plan-save"><input type="checkbox" id="plan-save" ${st.saved ? 'checked' : ''}> 이 기기에 진행 상황 저장하기</label>
        <p class="small muted" style="margin:6px 0 0">켜면 이 브라우저에 플랜 이름, 시작한 날짜, 체크한 날만 저장돼요(서버로 보내지 않아요). 끄면 바로 지워져요. 켜지 않으면 이 페이지를 떠날 때 체크가 사라질 수 있어요.</p>
        <div class="row" style="margin-top:12px"><button class="btn gold sm" id="plan-img">플랜 이미지 저장 (1080×1920)</button><button class="btn sm" id="plan-link">플랜 링크 복사</button><a class="btn ghost sm" href="#character-${ch.id}">인물 더 보기</a></div>
      </div>
    </section>`;
    const pimg = $app.querySelector('img[data-portrait]');
    pimg.src = RENDER.hasPortrait(ch.id) ? RENDER.portraitSrc(ch.id) : RENDER.portraitCanvas(ch.id, 480, 600).toDataURL('image/jpeg', 0.88);
    const persist = (checked) => {
      const all = planStore();
      if (all[pl.slug]) { all[pl.slug].checked = checked; planWrite(all); } else memPlan[pl.slug] = checked;
    };
    $app.querySelectorAll('input[data-day]').forEach(cb => cb.addEventListener('change', () => {
      const cur = planState(pl.slug).checked.filter(x => x !== +cb.dataset.day);
      if (cb.checked) cur.push(+cb.dataset.day);
      cur.sort((a, b) => a - b); persist(cur);
      cb.closest('.plan-day').classList.toggle('is-done', cb.checked);
      const n = cur.length, bar = $app.querySelector('.plan-head .bar');
      bar.setAttribute('aria-valuenow', n); bar.setAttribute('aria-label', `7일 중 ${n}일 완료`); bar.querySelector('i').style.width = Math.max(4, n / 7 * 100) + '%';
      bar.nextElementSibling.textContent = `${n}/7일 완료` + (today ? ` · 오늘은 ${today}일차예요` : '');
      if (n === 7) toast('7일 묵상을 모두 마쳤어요. 수고 많으셨어요!');
    }));
    document.getElementById('plan-save').addEventListener('change', e => {
      const all = planStore();
      if (e.target.checked) {
        all[pl.slug] = { startedAt: todayStr(), checked: planState(pl.slug).checked };
        if (planWrite(all)) toast('이 기기에 진행 상황을 저장했어요.'); else { e.target.checked = false; toast('이 브라우저에서는 저장할 수 없어요.'); }
      } else { memPlan[pl.slug] = (all[pl.slug] || {}).checked || []; delete all[pl.slug]; planWrite(all); toast('저장된 진행 상황을 지웠어요.'); }
      planPage(arg);
    });
    document.getElementById('plan-img').onclick = async () => {
      try {
        await ensureFonts(); await RENDER.preload([ch.id]);
        const blob = await RENDER.toBlob(RENDER.render((c, w, h) => RENDER.drawPlan(c, w, h, pl), 1080, 1920));
        await saveBlob(blob, `my-faith-story-${ch.id.replace(/^(ot|nt)-/, '')}-7day-plan.png`);
      } catch (e) { toast('이미지를 만들지 못했어요. 다시 시도해 주세요.'); }
    };
    document.getElementById('plan-link').onclick = () => copy(`[7일 묵상] ${pl.title}\n` + (PUBLIC_BASE_URL || ARTIFACT_URL) + '#plan-' + pl.slug);
  }

  // ── Small-group guide (public content only)
  const canPrint = !framed && typeof window.print === 'function';
  function groupPage(arg) {
    if (!arg) { $app.innerHTML = `<section class="wrap prose"><h1>나눔 가이드를 찾을 수 없어요</h1><a class="btn gold" href="#group">소그룹 나눔 안내로</a></section>`; return; }
    const g = GROUP.build(arg.characterId, arg.eventId), ch = D.CHAR_BY_ID[g.characterId];
    const url = (PUBLIC_BASE_URL || ARTIFACT_URL) + '#group-' + g.slug;
    $app.innerHTML = `<section class="wrap guide">
      <div class="plan-head">
        <img class="plan-portrait" alt="${esc(ch.displayName)} ${RENDER.hasPortrait(ch.id) ? '수채화 일러스트' : '임시 일러스트'}" data-portrait="${ch.id}">
        <div><p class="eyebrow">Small Group Guide</p>
          <h1 style="font-size:clamp(26px,4vw,38px);margin:6px 0">${esc(g.title)}</h1>
          <p style="margin:0" class="muted">${esc(g.subtitle)} · 리더용</p>
          <div class="row no-print" style="margin-top:12px"><button class="btn gold sm" id="g-copy">단톡방용 텍스트 복사</button>${canPrint ? '<button class="btn sm" id="g-print">인쇄하기</button>' : ''}<a class="btn ghost sm" href="#group">다른 인물 고르기</a></div>
        </div>
      </div>
      <ol class="guide-steps">${g.sections.map((sct, i) => `<li class="panel">
        <div class="sectitle"><h2><span class="step-n">${i + 1}</span>${esc(sct.title)}</h2><span class="chip">${sct.minutes}분</span></div>
        ${sct.ref ? `<p style="margin:0 0 8px"><span class="chip gold">${esc(sct.ref)}</span></p>` : ''}
        ${sct.items ? `<ul class="guide-items">${sct.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        ${sct.questions ? `<ol class="guide-qs">${sct.questions.map(q => `<li><span class="chip">${esc(q.kind)}</span> ${esc(q.q)}</li>`).join('')}</ol>` : ''}
      </li>`).join('')}</ol>
      <div class="panel"><div class="sectitle"><h2>리더를 위한 안내</h2></div><ul class="guide-items">${g.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      <p class="small muted">질문과 진행표는 서비스가 만든 초안이에요(검수 전). 모임 상황에 맞게 자유롭게 바꿔 쓰세요. 나의 응답이나 점수는 담기지 않아요.</p>
    </section>`;
    $app.querySelector('img[data-portrait]').src = RENDER.hasPortrait(ch.id) ? RENDER.portraitSrc(ch.id) : RENDER.portraitCanvas(ch.id, 480, 600).toDataURL('image/jpeg', 0.88);
    document.getElementById('g-copy').onclick = () => copy(GROUP.toText(g, url));
    const pr = document.getElementById('g-print'); if (pr) pr.onclick = () => window.print();
  }
  let groupFilter = '';
  function groupHub() {
    const list = D.CHARACTERS.filter(c => c.eventIds.some(id => ['primary', 'support'].includes(D.EVENT_BY_ID[id].eligibility)));
    const shown = list.filter(c => !groupFilter || c.displayName.includes(groupFilter.trim()));
    $app.innerHTML = `<section class="wrap prose" style="max-width:880px">
      <p class="eyebrow">Small Group</p><h1 style="font-size:clamp(26px,4vw,36px);margin-top:6px">소그룹 나눔 가이드</h1>
      <p>교회 소그룹이나 셀 모임에서 각자 테스트를 해 보고, 한 인물의 장면을 함께 읽으며 나누는 약 60분 진행표예요. 로그인이나 결과 수집 없이, 각자 원하는 만큼만 자기 카드를 보여 주며 나눠요.</p>
      <h2>이렇게 진행해요</h2>
      <ol><li>모임 전에 각자 12문항 테스트를 해요(선택). 링크: 이 사이트 첫 화면</li><li>리더가 이번 모임에서 함께 읽을 인물을 아래에서 골라요. 모임원 중 한 사람의 결과 인물이나, 이번 주 설교 본문과 가까운 인물이면 좋아요.</li><li>가이드의 ‘단톡방용 텍스트 복사’로 미리 나눠 주고, 모임에서는 순서대로 진행해요.</li></ol>
      <h2>리더를 위한 안내</h2><ul>${GROUP.LEADER_TIPS.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <h2>함께 읽을 인물 고르기</h2>
      <div class="dict-tools"><label class="sr-only" for="gq">인물 이름 검색</label><input id="gq" type="search" placeholder="이름으로 검색 (예: 룻)" value="${esc(groupFilter)}"><span class="small muted">${shown.length}명</span></div>
      <ul class="dict">${shown.map(c => { const e = c.eventIds.map(id => D.EVENT_BY_ID[id]).find(x => ['primary', 'support'].includes(x.eligibility)); return `<li><a href="#group-${GROUP.slug(c.id, e.id)}"><img alt="" loading="lazy" data-portrait="${c.id}" width="288" height="360"><b>${esc(c.displayName)}</b><span>${esc(e.title)}</span></a></li>`; }).join('')}</ul>
    </section>`;
    let k = 0; const imgs = [...$app.querySelectorAll('img[data-portrait]')];
    const paint = () => { const end = Math.min(imgs.length, k + 6); for (; k < end; k++) imgs[k].src = RENDER.portraitURL(imgs[k].dataset.portrait); if (k < imgs.length) requestAnimationFrame(paint); };
    paint();
    const gq = document.getElementById('gq'); let t;
    gq.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { groupFilter = gq.value; groupHub(); const n = document.getElementById('gq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); });
  }

  function about() {
    const R = window.MFS_RARITY; const T = D.CONFIG.rarityThresholds;
    const kc = Object.values(R.keys).reduce((a, v) => (a[v.rarity] = (a[v.rarity] || 0) + 1, a), {});
    $app.innerHTML = `<section class="wrap prose">
      <p class="eyebrow">About</p><h1 style="font-size:34px;margin-top:6px">서비스 소개 · FAQ</h1>
      <h2>무엇을 하나요?</h2><p>최근 4주 동안의 신앙·말씀·기도·예배·성찰·공동체 행동에 관한 12개의 A/B 질문에 답하면, 등록된 성경 사건 프로필 ${D.EVENTS.length}개(대표·보조 비교 대상 ${D.EVENTS.filter(e => e.eligibility === 'primary' || e.eligibility === 'support').length}개)와 비교해 닮은 장면을 보여 줘요. 신앙 수준, 구원, 영성, 인격, 하나님의 평가, 심리 상태를 판정하지 않아요.</p>
      <h2>어떻게 비교하나요?</h2><p>선택지마다 행동 신호와 내용 가중치가 있고, 각 사건에는 본문에 기록된 행동 신호가 있어요. 응답과 사건 사이의 특성 유사도, 행동 일치도, 서로 다른 문항 근거 수, 행동의 고유성을 합쳐 내부 지표(0~100)를 만들고, 서로 다른 문항에서 2개 이상 근거가 있는 사건만 후보가 돼요. 실시간 AI를 쓰지 않으며 같은 응답은 항상 같은 결과가 나와요.</p>
      <h2>카드 등급(C·U·R·RR·SR·UR)은?</h2><p>대표 특기 + 보조 특성 계열 + 사건 상황 유형 조합이 4,096가지 응답 조합 가운데 몇 번 나오는지로 정한 <b>설계상 희귀도</b>예요. 실제 이용자 비율이나 뽑기 확률이 아니고, 좋은 답에 높은 등급을 주지 않아요. 카드에 함께 적힌 ‘능력치’는 6개 영역에서 어느 쪽 성향을 골랐는지 보여 줄 뿐, 높고 낮음이 없어요.</p>
      <div class="tablewrap"><table><tr><th>등급</th><th>조합 등장 건수(4,096 기준)</th><th>현재 조합 수</th></tr>
        ${D.CONFIG.rarityGrades.map(([g, min], i, arr) => `<tr><td>${g}</td><td>${i ? `${min}~${arr[i - 1][1] - 1}` : `${min} 이상`}</td><td>${kc[g] || 0}</td></tr>`).join('')}</table></div>
      <p class="small">특별판: <b>SA (스토리 아트)</b> — 사건 장면 일러스트가 준비된 카드에 붙어요. <b>P (프로모)</b> — 성탄·부활절 기간에 받은 카드에 기념 표시가 붙어요. 둘 다 등급과는 별개예요.</p>
      <h2>개인정보</h2><p>로그인·회원가입이 없고 이름, 이메일, 전화번호, 교회명을 묻지 않아요. 응답은 이 브라우저 탭의 메모리와 sessionStorage에만 있고, 서버·외부 AI·분석 도구로 보내지 않아요. ‘다시 검사하기’를 누르거나 탭을 닫으면 지워져요. 공유 링크에는 인물·사건 소개만 담겨요.</p>
      <h2>성경 인용과 저작권</h2><p>성경 번역 본문을 옮기지 않고, 장절 표기와 서비스의 자체 요약만 사용해요. 모든 인물·사건 데이터는 <b>콘텐츠 검수 전 초안</b>이며 전문가 검수가 필요해요.</p>
      <h2>일러스트</h2><p>인물 ${(window.MFS_PORTRAITS || []).length}명은 AI 이미지 생성 도구로 만든 창작 수채화 일러스트예요(실제 모습을 재현한 것이 아니며 콘텐츠 검수 전). 나머지 인물과 사건 장면은 코드로 그린 <b>임시 이미지</b>이고, 생성 큐에 남아 있어요.</p>
      <h2>한계</h2><ul><li>12개 문항으로 볼 수 있는 행동은 일부예요. 결과는 성경 속 사건의 한 장면과 비교한 묵상 자료일 뿐이에요.</li><li>100명이 사전에 등록되어 있지만 대표 결과로 나올 수 있는 인물은 근거가 충분한 ${D.CHARACTERS.filter(c => c.eligibleForPrimary).length}명이고, 실제로 4,096 조합에서 대표로 나오는 인물은 그보다 적어요.</li><li>유사도 임계값과 가중치는 경험적 설정이며 검증된 심리 척도가 아니에요.</li></ul>
      <p class="small muted">데이터 버전 ${esc(D.DATA_VERSION)} · 희귀도 규칙 ${esc(D.CONFIG.rarityRuleVersion)}</p>
    </section>`;
  }

  // header links
  render();
})();

</script>

</body></html>
