# Deploys the prebuilt static site in hosting/ to Firebase Hosting (project my-faith-story).
# One-time setup: add the repository secret FIREBASE_SERVICE_ACCOUNT_MY_FAITH_STORY
# (Firebase console → Project settings → Service accounts → Generate new private key → paste the JSON).
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main, claude/keen-mccarthy-gvfkvu]
    paths: ['hosting/**', 'firebase.json', '.firebaserc', '.github/workflows/firebase-hosting.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_FAITH_STORY }}
          projectId: my-faith-story
          channelId: live
